[project]
name = "relay-mortgage-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "relay-adapter-models-openai",
  "relay-adapter-tools-http",
  "mortgage-tools-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_mortgage_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/relay_mortgage_agent/system_prompt.txt" = "relay_mortgage_agent/system_prompt.txt"
