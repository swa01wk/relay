[project]
name = "relay-adapter-observability-otel"
version = "0.1.0"
description = "OpenTelemetry traces from the Relay event stream"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_observability_otel"]
