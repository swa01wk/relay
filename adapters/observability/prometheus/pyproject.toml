[project]
name = "relay-adapter-observability-prometheus"
version = "0.1.0"
description = "Prometheus metrics from the Relay event stream"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "prometheus-client>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_observability_prometheus"]
