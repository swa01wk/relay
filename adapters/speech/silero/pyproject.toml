[project]
name = "relay-adapter-speech-silero"
version = "0.1.0"
description = "Silero VAD TurnDetector adapter"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "pipecat-ai>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_speech_silero"]
