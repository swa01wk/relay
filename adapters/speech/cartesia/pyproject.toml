[project]
name = "relay-adapter-speech-cartesia"
version = "0.1.0"
description = "Cartesia STT adapter (Ink models)"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[cartesia]>=1.11,<2",
  "websockets>=13,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_speech_cartesia"]
