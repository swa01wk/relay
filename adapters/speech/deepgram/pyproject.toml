[project]
name = "relay-adapter-speech-deepgram"
version = "0.1.0"
description = "Deepgram STT adapter"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "pipecat-ai[deepgram]>=1.11,<2",
  "websockets>=13,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_speech_deepgram"]
