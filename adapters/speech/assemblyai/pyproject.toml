[project]
name = "relay-adapter-speech-assemblyai"
version = "0.1.0"
description = "AssemblyAI streaming STT adapter (Universal models)"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[assemblyai]>=1.11,<2",
  "websockets>=13,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_speech_assemblyai"]
