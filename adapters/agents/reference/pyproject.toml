[project]
name = "relay-adapter-agents-reference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "relay-adapter-models-openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_agents_reference"]

[tool.hatch.build.targets.wheel.force-include]
"src/relay_adapter_agents_reference/system_prompt.txt" = "relay_adapter_agents_reference/system_prompt.txt"
