[project]
name = "relay-adapter-persistence-redis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "redis>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_persistence_redis"]
