[project]
name = "relay-adapter-persistence-postgres"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "relay-runtime",
  "asyncpg>=0.29,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_adapter_persistence_postgres"]
