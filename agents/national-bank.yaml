# VNB Sahayak — Vasundhara National Bank's assistant (a declarative Relay agent, no Python).
# Loaded by the gateway at startup from $RELAY_AGENTS_DIR. The bank portal connects with agentId "national-bank".
agent_id: national-bank

# Tools service: GET /tools (discovery) and POST /tools/{name}. Env vars expand: ${VAR:-default}.
tools_url: ${RELAY_VNB_TOOLS_URL:-http://localhost:8096}

system_prompt_file: national-bank.prompt.md

instructions: >
  Good fits: loan options for a need → table from recommend_loans (product, rate, EMI, tenure, total cost, eligible) then
  SHOW_LOAN_PRODUCT for the best one; savings choices → table from compare_savings_options; an EMI schedule → bar chart of
  principal vs. interest by year from calculate_emi; FD options → table from quote_deposit for a few tenures; spending by
  category or month → bar chart from summarize_spending; statement lines → the portal's own statement page (SHOW_STATEMENT);
  a transfer → the Funds transfer form filled in (START_TRANSFER) or a form bound to transfer_funds; schemes → table from
  list_government_schemes with eligibility. Prefer the portal's own screens (SHOW_STATEMENT, START_TRANSFER,
  SHOW_LOAN_PRODUCT, navigation and its forms) over duplicates. Account types → table from list_account_products; bills due →
  table from list_billers; mutual fund schemes → table from list_mutual_funds (with the risk disclaimer).

tool_timeout_seconds: 30

