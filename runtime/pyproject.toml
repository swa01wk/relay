[project]
name = "relay-runtime"
version = "0.1.0"
description = "Relay runtime core — sessions, events, ports"
requires-python = ">=3.11"
dependencies = [
  "relay-protocol",
  "relay-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
