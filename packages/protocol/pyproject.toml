[project]
name = "relay-protocol"
version = "0.1.0"
description = "Relay Protocol (RP) event schemas and validation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
