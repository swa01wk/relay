[project]
name = "relay-sdk"
version = "0.1.0"
description = "Shared Relay event models for runtime and agents"
requires-python = ">=3.11"
dependencies = ["relay-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_sdk"]
