# Prometheus for a Relay gateway. Used by docker-compose.observability.yml; copy the scrape job
# into your own Prometheus otherwise.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: relay-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
    # With RELAY_METRICS_TOKEN set on the gateway (recommended outside local dev):
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/relay-metrics-token
