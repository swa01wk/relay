# Optional monitoring stack: Prometheus (scrapes the gateway, evaluates alert rules) + Grafana.
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.observability.yml up -d
# Prometheus http://localhost:9091 · Grafana http://localhost:3013 (dashboard: Relay → Relay overview)
# Host ports: RELAY_PROMETHEUS_PORT / RELAY_GRAFANA_PORT in infra/docker/.env.
# Both listen on localhost only; put them behind your own auth before exposing them.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - relay-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${RELAY_PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - relay-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${RELAY_GRAFANA_PORT:-3013}:3000"
    depends_on:
      - prometheus

volumes:
  relay-prometheus-data:
  relay-grafana-data:
