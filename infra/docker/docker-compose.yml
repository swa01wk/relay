services:
  redis:
    image: redis:7-alpine
    # Host 6379 is commonly taken; gateway still reaches redis:6379 on the compose network.
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    # Named volume keeps relay_events across `docker compose down` (use `down -v` to wipe).
    volumes:
      - relay-pg-data:/var/lib/postgresql/data
    # Host 5432 is commonly taken; gateway still reaches postgres:5432 on the compose network.
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  mortgage-tools:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mortgage-tools
    ports:
      - "8090:8090"
    # Experience Center: sessions for a `sandbox_…` user get their own copy of the data.
    environment:
      MORTGAGE_SANDBOXES: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-tools:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.crm-tools
    ports:
      - "8091:8091"
    # CRM data (SQLite) survives restarts and `down`; `down -v` resets it to the demo seed.
    environment:
      CRM_DB_PATH: /data/crm.db
      # Experience Center: sessions for a `sandbox_…` user get their own database here.
      CRM_SANDBOX_DIR: /data/sandboxes
    volumes:
      - crm-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  shop-tools:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.shop-tools
    ports:
      - "8092:8092"
    # Store data (SQLite) survives restarts and `down`; `down -v` resets it to the demo catalog.
    # Experience Center: sessions for a `sandbox_…` user get their own store under /data/sandboxes.
    environment:
      SHOP_DB_PATH: /data/shop.db
      SHOP_SANDBOX_DIR: /data/sandboxes
    volumes:
      - shop-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      RELAY_GATEWAY_HOST: "0.0.0.0"
      RELAY_GATEWAY_PORT: "8080"
      RELAY_DATABASE_URL: "postgresql://relay:relay@postgres:5432/relay"
      RELAY_REDIS_URL: "redis://redis:6379/0"
      # Demo: the mortgage example is the default agent for dev sessions (off in production).
      RELAY_EXAMPLE_MORTGAGE: "1"
      RELAY_MORTGAGE_TOOLS_URL: "http://mortgage-tools:8090"
      RELAY_CRM_TOOLS_URL: "http://crm-tools:8091"
      RELAY_SHOP_TOOLS_URL: "http://shop-tools:8092"
      RELAY_AGENTS_DIR: /app/agents
      # Encrypts customers' model keys at rest. The fallback is a public, dev-only value:
      # set a long random RELAY_SECRETS_KEY in .env for anything real, and never change it
      # afterwards (stored secrets become unreadable).
      RELAY_SECRETS_KEY: ${RELAY_SECRETS_KEY:-relay-dev-only-secrets-key-not-for-production}
      # Local dev: customers' tools URLs may point at localhost / compose services.
      RELAY_ALLOW_PRIVATE_TOOLS_URLS: "1"
      # New accounts confirm their email. Without RELAY_SMTP_HOST the emails (with their links) are
      # printed to this container's log: `docker compose ... logs gateway`.
      RELAY_EMAIL_VERIFICATION: required
      # Local dev: anyone may sign up. On a public gateway use allowlist (see RELAY_SIGNUP_ALLOWLIST) or closed.
      RELAY_SIGNUP: open
      # Local dev: sessions without an API key (POST /dev/sessions). Never set this in production.
      RELAY_DEV_SESSIONS: "1"
      # Local dev: open /metrics. In production set RELAY_METRICS_TOKEN instead (see reference).
      RELAY_METRICS_ENABLED: "1"
    # Declarative agents (agents/*.yaml); edit and restart the gateway to apply.
    volumes:
      - ../../agents:/app/agents:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mortgage-tools:
        condition: service_healthy
      crm-tools:
        condition: service_healthy
      shop-tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  relay-pg-data:
  crm-data:
  shop-data:
